name: Build DH Browser Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar estructura del proyecto
        run: |
          echo "Archivos en la raiz del repo:"
          ls -la
          sed -i 's/\r$//' setup.sh
          bash setup.sh

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Aceptar licencias del Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DH-Browser-AndroidTV-APK
          path: app/build/outputs/apk/debug/*.apk
